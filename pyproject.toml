[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acled-viz"
version = "0.1.0"
description = "Gaza conflict visualisation and forecast gallery toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "acled-viz contributors" }]
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1.3",
  "imageio>=2.37.0",
  "imageio-ffmpeg>=0.6.0",
  "matplotlib>=3.9.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
docs = [
  "myst-parser>=4.0.0",
  "nbsphinx>=0.9.6",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.1.0",
  "sphinx-autodoc-typehints>=2.5.0",
  "sphinx-design>=0.6.1",
]
osm = [
  "osmnx>=2.0.0",
]

[project.scripts]
acled-viz = "acled_viz.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
